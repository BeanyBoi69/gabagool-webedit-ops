- type: entity
  name: magnetized trash bag
  id: TrashBagMagnet
  parent: TrashBag
  components:
  - type: Sprite
    sprite: _Goobstation/Objects/Specific/Janitorial/trashbag.rsi
    layers:
    - state: magnet-icon-0
      map: ["enum.StorageFillLayers.Fill"]
  - type: Item
    heldPrefix: magnet
  - type: StorageFillVisualizer
    fillBaseName: magnet-icon
  - type: MagnetPickup
  - type: ItemToggle
    soundActivate:
      collection: sparks
      params:
        variation: 0.250
    soundDeactivate:
      collection: sparks
      params:
        variation: 0.250
